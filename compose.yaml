
services:

  # 1. MySQL database
  mysql:
    image: mysql:8.4
    container_name: weather-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

    ports:
      - "127.0.0.1:3307:3306"

    volumes:
      - weather_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    networks:
      - weather-network

  # 2. FastAPI application
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: weather-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml:ro

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"

    networks:
      - weather-network

  # 3. Scheduled weather collector
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: weather-scheduler
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: "3306"

    volumes:
      - ./app:/app/app
      - ./config.yaml:/app/config.yaml:ro

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - python
      - -m
      - app.scheduler

    networks:
      - weather-network

# Persistent database storage
volumes:
  weather_mysql_data:

# Internal communication network
networks:
  weather-network:
    driver: bridge
